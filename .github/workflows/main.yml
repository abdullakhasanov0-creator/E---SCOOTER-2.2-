name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack zip and find project
        id: proj
        run: |
          for z in *.zip; do
            [ -f "$z" ] && unzip -q -o "$z" -d _src
          done
          f=$(find . -name settings.gradle.kts | head -n1)
          if [ -z "$f" ]; then echo "settings.gradle.kts not found"; ls -R | head -50; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: E-scooter-App-debug
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
